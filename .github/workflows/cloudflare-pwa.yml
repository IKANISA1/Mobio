name: Cloudflare PWA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Cloudflare Pages branch/environment to deploy to
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy-pwas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Mobio

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Validate PWA deployment configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_CLIENT_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_CLIENT_PROJECT_NAME }}
          CLOUDFLARE_PAGES_ADMIN_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_ADMIN_PROJECT_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$PRIVACY_POLICY_URL"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PAGES_CLIENT_PROJECT_NAME"
          test -n "$CLOUDFLARE_PAGES_ADMIN_PROJECT_NAME"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler whoami

      - name: Build PWA bundles
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
        run: ./scripts/web/prepare_pwa_bundles.sh

      - name: Deploy client PWA
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build/pwa/client
            --project-name=${{ vars.CLOUDFLARE_PAGES_CLIENT_PROJECT_NAME }}
            --branch=${{ inputs.branch }}

      - name: Deploy admin PWA
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build/pwa/admin
            --project-name=${{ vars.CLOUDFLARE_PAGES_ADMIN_PROJECT_NAME }}
            --branch=${{ inputs.branch }}
