name: Cloudflare Website, Consumer App and Admin

on:
  workflow_call:
    inputs:
      branch:
        description: Cloudflare Pages branch/environment to deploy to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      branch:
        description: Cloudflare Pages branch/environment to deploy to
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: mobio-pages-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  deploy-pwas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Mobio

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Prepare Flutter workspace
        run: ./scripts/ci/bootstrap_flutter.sh

      - name: Run admin PWA readiness contracts
        run: >-
          flutter test
          test/release/admin_panel_production_readiness_contract_test.dart
          test/release/scope_boundary_test.dart
          test/release/mobile_readiness_contract_test.dart

      - name: Validate PWA deployment configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || secrets.PRIVACY_POLICY_URL }}
          ACCOUNT_DELETION_URL: ${{ vars.ACCOUNT_DELETION_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_PAGES_CLIENT_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_CLIENT_PROJECT_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PAGES_PROJECT_NAME="${CLOUDFLARE_PAGES_PROJECT_NAME:-${CLOUDFLARE_PAGES_CLIENT_PROJECT_NAME:-}}"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$PRIVACY_POLICY_URL"
          test -n "$ACCOUNT_DELETION_URL"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PAGES_PROJECT_NAME"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler whoami

      - name: Build PWA bundles
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || secrets.PRIVACY_POLICY_URL }}
          ACCOUNT_DELETION_URL: ${{ vars.ACCOUNT_DELETION_URL }}
        run: |
          python3 scripts/web/fetch_previous_assets.py build/previous-public-site
          PREVIOUS_SITE_DIR=build/previous-public-site ./scripts/web/prepare_pwa_bundles.sh

      - name: Verify generated PWA bundles
        run: ./scripts/web/verify_pwa_bundles.sh build/pwa

      - name: Exercise Pages route and recovery behavior
        run: |
          node --test scripts/tests/pages_worker.test.mjs scripts/tests/admin_service_worker.test.mjs
          python3 -m unittest discover -s scripts/tests

      - name: Deploy combined Pages site
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build/pwa/site
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_CLIENT_PROJECT_NAME }}
            --branch=${{ inputs.branch }}

      - name: Verify the deployed public release
        env:
          MOBIO_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          MOBIO_DEPLOYMENT_BRANCH: ${{ inputs.branch }}
        run: |
          python3 scripts/web/verify_public_release.py --site build/pwa/site --origin "$MOBIO_DEPLOYMENT_URL" --output build/qa/pages-deployment.json
          if [[ "$MOBIO_DEPLOYMENT_BRANCH" == "main" ]]; then
            python3 scripts/web/verify_public_release.py --site build/pwa/site --origin https://mobio.ikanisa.com --output build/qa/pages-website.json
            python3 scripts/web/verify_public_release.py --site build/pwa/site --origin https://mobioadmin.ikanisa.com --output build/qa/pages-admin.json
          fi
