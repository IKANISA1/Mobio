name: Cloudflare Website, Consumer App and Admin Candidate

on:
  workflow_call:
    inputs:
      branch:
        description: Intended Pages branch for the candidate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      branch:
        description: Intended Pages branch for the candidate
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: mobio-pages-candidate-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Mobio

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.84.2

      - name: Verify full Flutter app including admin PWA readiness contracts
        run: ./scripts/ci/verify_flutter.sh

      - name: Verify linked Supabase backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          REQUIRE_LINKED_SUPABASE: 'true'
        run: ./scripts/ci/verify_backend.sh

      - name: Verify current hardening migration source
        run: python3 scripts/ci/prepare_hardening_migrations.py --check

      - name: Build PWA bundles
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || secrets.PRIVACY_POLICY_URL }}
          ACCOUNT_DELETION_URL: ${{ vars.ACCOUNT_DELETION_URL }}
        run: |
          python3 scripts/web/fetch_previous_assets.py build/previous-public-site
          PREVIOUS_SITE_DIR=build/previous-public-site ./scripts/web/prepare_pwa_bundles.sh

      - name: Verify generated PWA bundles
        run: ./scripts/web/verify_pwa_bundles.sh build/pwa

      - name: Exercise Pages route and recovery behavior
        run: |
          node --test scripts/tests/pages_worker.test.mjs scripts/tests/admin_service_worker.test.mjs
          python3 -m unittest discover -s scripts/tests

      - name: Record exact PWA candidate and intended destination
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_CLIENT_PROJECT_NAME }}
          MOBIO_PAGES_BRANCH: ${{ inputs.branch }}
        run: >-
          python3 scripts/web/pwa_candidate_manifest.py create
          --site build/pwa/site --out build/pwa-candidate.json
          --account "$CLOUDFLARE_ACCOUNT_ID" --project "$CLOUDFLARE_PAGES_PROJECT_NAME"
          --branch "$MOBIO_PAGES_BRANCH" --environment Mobio

      - name: Upload prepared site and candidate for independent review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-release-candidate
          path: |
            build/pwa/site
            build/pwa-candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
