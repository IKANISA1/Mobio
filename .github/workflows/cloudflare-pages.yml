name: Cloudflare Pages Candidate

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Intended Pages branch for the candidate
        required: true
        default: main

permissions:
  contents: read

jobs:
  build-pages-candidate:
    # Both manual entrypoints produce the combined candidate for review.
    # Publishing requires the separate approval-gated deployment script.
    uses: ./.github/workflows/cloudflare-pwa.yml
    with:
      branch: ${{ inputs.branch }}
    secrets: inherit
