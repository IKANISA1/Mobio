name: Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Cloudflare Pages branch/environment to deploy to
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy-pages:
    # Both manual entrypoints must deploy the verified combined site. Deploying
    # landing/ alone to this Pages project removes consumer and Admin runtimes.
    uses: ./.github/workflows/cloudflare-pwa.yml
    with:
      branch: ${{ inputs.branch }}
    secrets: inherit
