name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Verify Flutter app
        run: ./scripts/ci/verify_flutter.sh

      - name: Privacy request domain tests
        run: flutter test test/increment09

      - name: Session persistence and native adapter tests
        run: flutter test test/increment08

      - name: Build AAB (release)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || secrets.PRIVACY_POLICY_URL }}
          ACCOUNT_DELETION_URL: ${{ vars.ACCOUNT_DELETION_URL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$PRIVACY_POLICY_URL"
          test -n "$ACCOUNT_DELETION_URL"
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$STORE_PASSWORD" ]]; then
            echo "UNAVAILABLE: signed release AAB requires all Android signing secrets." >&2
            exit 2
          fi
          PRESERVE_ANDROID_SIGNING_FILES=true ./scripts/ci/write_android_signing_files.sh
          trap 'rm -f android/key.properties android/app/release.keystore' EXIT
          ./scripts/release/build_android_release.sh appbundle

  ios:
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Parse iOS session storage integration
        run: swiftc -frontend -parse ios/Runner/AppDelegate.swift

      - name: Build iOS (release, no codesign)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || secrets.PRIVACY_POLICY_URL }}
          ACCOUNT_DELETION_URL: ${{ vars.ACCOUNT_DELETION_URL }}
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
        run: ./scripts/ci/verify_ios_release.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pinned CI parser
        run: python3 -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt

      - name: Check production-gate regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_production_gates.py' -v

      - name: Check GitHub Actions pins
        run: ./scripts/ci/check_github_actions_pinned.sh

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.84.2

      - name: Booking direct-write boundary in PostgreSQL and PostgREST
        env:
          MOBIO_BOOKING_POSTGRES_IMAGE: postgres@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
          MOBIO_BOOKING_POSTGREST_IMAGE: public.ecr.aws/supabase/postgrest@sha256:5922bde07147b82b1c9d8f749e48c1e5b99ebb233f3888bb7ab65f07cf4ac82d
        run: |
          docker pull --quiet "$MOBIO_BOOKING_POSTGRES_IMAGE"
          docker pull --quiet "$MOBIO_BOOKING_POSTGREST_IMAGE"
          python3 scripts/qa/test_booking_authority_postgrest.py

      - name: Require reviewed hardening migrations in this commit
        run: python3 scripts/ci/prepare_hardening_migrations.py --check

      - name: Member ID remediation gate in isolated PostgreSQL 17
        env:
          MOBIO_MEMBER_ID_POSTGRES_IMAGE: postgres@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
        run: |
          docker pull --quiet "$MOBIO_MEMBER_ID_POSTGRES_IMAGE"
          python3 scripts/qa/test_member_id_migration.py

      - name: Check BioPay discovery authorization in isolated PostgreSQL
        run: ./scripts/qa/test_biopay_discovery_db.sh

      - name: Chat delivery SQL and concurrency in isolated PostgreSQL 17
        env:
          MOBIO_CHAT_POSTGRES_IMAGE: postgres@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
        run: python3 scripts/qa/test_chat_postgres.py

      - name: Notification outbox SQL and concurrency in isolated PostgreSQL 17
        env:
          MOBIO_PUSH_POSTGRES_IMAGE: postgres@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
        run: python3 scripts/qa/test_push_postgres.py

      - name: Privacy request SQL and concurrency in isolated PostgreSQL 17
        env:
          MOBIO_PRIVACY_POSTGRES_IMAGE: postgres@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
        run: python3 scripts/qa/test_privacy_postgres.py

      - name: Check native Deno privacy entrypoint
        run: deno check supabase/functions/privacy-requests/index.ts

      - name: Check native Deno notification entrypoints
        run: |
          deno check supabase/functions/push-outbox-worker/index.ts supabase/functions/send-push/index.ts
          deno test supabase/functions/send-push/index_test.ts

      - name: Check public payment-link routing
        run: deno test --allow-read test/web/payment_link_worker_test.ts

      - name: Rehearse BioPay against the complete database schema
        run: ./scripts/qa/test_biopay_full_schema.sh

      - name: Real Auth and HTTP session authority regression
        env:
          MOBIO_AUTH_BASELINE_ONLY: '0'
          MOBIO_AUTH_EVIDENCE_DIR: build/qa/auth-session-authority
        run: |
          deno cache --frozen --lock=deno.lock scripts/qa/test_auth_session_authority_http.ts
          ./scripts/qa/test_auth_session_authority.sh

      - name: Verify backend contract
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          REQUIRE_LINKED_SUPABASE: 'true'
        run: ./scripts/ci/verify_backend.sh

  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # existing reviewed v4 pin
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.23.3' # current 22.x maintenance release; local evidence records 22.16.0 separately
          package-manager-cache: false
      - name: Privacy gateway and evidence tests
        run: bash scripts/ci/run_privacy_checks.sh
      - name: Install the pinned YAML parser
        run: python3 -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt
      - name: Release gate and migration preparation unit tests
        run: |
          python3 -m unittest discover -s scripts/tests -p test_production_gates.py -v
          python3 -m unittest discover -s scripts/tests -p test_hardening_preparation.py -v
          python3 -m unittest discover -s scripts/tests -p test_play_version_evidence.py -v
          python3 -m unittest discover -s scripts/tests -p test_identity_lifecycle_contracts.py -v
          python3 -m unittest discover -s scripts/tests -p test_collector_queue_contracts.py -v
          python3 -m unittest discover -s scripts/tests -p test_sms_intake_contracts.py -v
          python3 -m unittest discover -s scripts/tests -p test_increment04_applier.py -v
          python3 -m unittest discover -s scripts/tests -p test_increment05_applier.py -v
          python3 -m unittest discover -s scripts/tests -p test_increment05_contracts.py -v
          python3 -m unittest discover -s scripts/tests -p test_receipt_reconciliation.py -v
          python3 -m unittest discover -s scripts/tests -p test_increment06_applier.py -v
          python3 -m unittest discover -s scripts/tests -p test_increment06_contracts.py -v
          python3 -m unittest discover -s scripts/tests -p test_push_operations.py -v
          python3 -m unittest discover -s scripts/tests -p test_increment07_applier.py -v
          python3 -m unittest discover -s scripts/tests -p test_increment07_contracts.py -v
          python3 -m unittest discover -s scripts/tests -p test_increment08_applier.py -v
          python3 -m unittest discover -s scripts/tests -p test_increment08_contracts.py -v
          python3 scripts/ci/check_github_actions_pinned.py
      - name: Pure Edge modules and actual handler fixtures (not live Deno)
        run: |
          node --experimental-strip-types --test scripts/tests/edge/hardening.test.mjs
          node --experimental-transform-types --loader ./scripts/tests/edge/fixture-loader.mjs --test scripts/tests/edge/handlers.test.mjs scripts/tests/edge/intake.test.mjs scripts/tests/edge/increment05.test.mjs
      - name: Notification worker protocol, native HTTP bounds and cryptography
        run: node --experimental-strip-types --test scripts/tests/push/*.test.mjs
      - name: Bounded inference HTTP tests with an explicit fake model
        run: python3 -m unittest discover -s services/face-inference/tests -p test_server_bounds.py -v
      - name: Session cipher real JVM cryptography tests
        run: bash scripts/ci/test_session_cipher.sh
      - name: Native NFC policy JVM fixtures
        run: |
          command -v kotlinc || { echo 'UNAVAILABLE: configure Kotlin on this runner; do not skip this check'; exit 2; }
          kotlinc -version
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          kotlinc android/app/src/main/kotlin/rw/mobi/app/BioPayNfcPolicy.kt scripts/tests/kotlin/BioPayNfcPolicyTest.kt -include-runtime -d "$scratch/nfc-policy-tests.jar"
          java -jar "$scratch/nfc-policy-tests.jar"
          kotlinc apps/momobio_sms_bridge/app/src/main/java/com/momobio/app/CollectorPolicy.kt apps/momobio_sms_bridge/app/src/main/java/com/momobio/app/CollectorLease.kt scripts/tests/kotlin/CollectorPolicyCheck.kt -include-runtime -d "$scratch/collector-policy-tests.jar"
          java -jar "$scratch/collector-policy-tests.jar"
      - name: Existing Pages and Worker fixtures
        run: |
          node --test scripts/tests/*.test.mjs
          cd cloudflare/face-service
          node --experimental-transform-types --test test/*.test.ts
      - name: Require remaining release evidence
        run: |
          echo 'These unit/fixture jobs do not replace the real Deno/SQL, Kotlin/Android, signed iOS or real-model acceptance gates.'
          echo 'Do not promote a release based on this job alone. Protected branch requirements must be configured separately.'

  collector-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # existing reviewed v4 pin
      - name: Assert Android/JDK tools and install explicit platform
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?Hosted runner must provide JDK 17}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          sdkmanager="${ANDROID_HOME:?Hosted runner must provide Android command-line tools}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build permission-free QA and run native component unit tests
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?}"
          export PATH="$JAVA_HOME/bin:$PATH"
          android/gradlew -p apps/momobio_sms_bridge --no-daemon :app:testQaUnitTest :app:assembleQa :app:assembleQaAndroidTest
          python3 apps/momobio_sms_bridge/scripts/verify_qa_apks.py --output build/qa/collector-apks
          echo 'Compilation/JVM and package-isolation checks only; instrumentation/device runs require their own evidence.'
