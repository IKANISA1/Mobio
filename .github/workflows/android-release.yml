name: Android Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Mobio

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.84.2

      - name: Verify Flutter app
        run: ./scripts/ci/verify_flutter.sh

      - name: Verify linked Supabase backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          REQUIRE_LINKED_SUPABASE: 'true'
        run: ./scripts/ci/verify_backend.sh

      - name: Validate Android release configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || secrets.PRIVACY_POLICY_URL }}
          ACCOUNT_DELETION_URL: ${{ vars.ACCOUNT_DELETION_URL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          REQUIRE_ANDROID_SIGNING: 'true'
          REQUIRE_SECRET_HISTORY_CLEAN: 'true'
          REQUIRE_IOS_FIREBASE: 'false'
          REQUIRE_IOS_NATIVE: 'false'
        run: ./scripts/ci/verify_release_config.sh

      - name: Write Android signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          PRESERVE_ANDROID_SIGNING_FILES: 'true'
        run: ./scripts/ci/write_android_signing_files.sh

      - name: Build signed Android App Bundle
        env:
          MOBIO_BUILD_ENVIRONMENT: Mobio
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || secrets.PRIVACY_POLICY_URL }}
          ACCOUNT_DELETION_URL: ${{ vars.ACCOUNT_DELETION_URL }}
        run: ./scripts/release/build_android_release.sh appbundle

      - name: Record Android release candidate
        run: python3 scripts/release/android_candidate_manifest.py create --aab build/app/outputs/bundle/release/app-release.aab --out build/release-candidate.json

      - name: Upload candidate and AAB artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-candidate
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/release-candidate.json
            build/android-release-build-inputs.json
          retention-days: 30

      - name: Upload mapping artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Clean Android signing files
        if: always()
        run: rm -f android/key.properties android/app/release.keystore
