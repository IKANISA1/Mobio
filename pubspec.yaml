name: mobi_app
description: "Mobio — Pan-African nearby mobility discovery, scheduled trip posts, and communication marketplace."
publish_to: 'none'
version: 1.0.0+17

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.4.3

  # Networking
  dio: ^5.9.2
  http: 1.6.0

  # Local Storage
  shared_preferences: ^2.5.4


  # UI & Design
  mobi_design_system:
    path: packages/design-system
  mobi_shared_types:
    path: packages/shared-types
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Utilities
  # Promote the existing locked dependency; no version upgrade.
  crypto: 3.0.7
  intl: ^0.20.2
  logger: ^2.7.0
  web: ^1.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  supabase_flutter: ^2.12.0
  app_links: ^6.4.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  lucide_icons: ^0.257.0
  flutter_typeahead: ^6.0.0
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  connectivity_plus: ^7.0.0
  flutter_native_splash: ^2.4.4

  firebase_core: ^4.6.0
  firebase_crashlytics: ^5.1.0
  app_settings: ^7.0.0
  go_router: ^17.1.0
  flutter_localizations:
    sdk: flutter
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0
  device_info_plus: ^12.3.0
  camera: ^0.12.0+1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  flutter_nfc_kit: ^3.6.2
  ndef: ^0.4.0

  firebase_analytics: ^12.2.0
  firebase_remote_config: ^6.3.0
  firebase_auth: ^6.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^3.2.3
  json_serializable: ^6.11.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  lucide_icons:
    path: packages/lucide_icons_compat

flutter:
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true

  assets:
    - assets/vehicles/
    - assets/google_fonts/
    - assets/icons/
    - assets/country_flags/
    - icon/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Inter-500.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-600.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon/mobi_logo_transparent.png"
  adaptive_icon_background: "#0C0F10"
  adaptive_icon_foreground: "icon/mobi_logo_transparent.png"
  min_sdk_android: 24
  web:
    generate: true
    image_path: "icon/mobi_logo_transparent.png"

flutter_native_splash:
  web: false
  color: "#FFFFFF"
  color_dark: "#000000"
  ios_content_mode: center
  image: "icon/mobi_logo_transparent.png"
  image_dark: "icon/mobi_logo_transparent.png"
  android_12:
    image: "icon/mobi_logo_transparent.png"
    image_dark: "icon/mobi_logo_transparent.png"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#000000"
    color: "#FFFFFF"
    color_dark: "#000000"
