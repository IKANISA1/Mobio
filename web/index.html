<!DOCTYPE html><html lang="en"><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mobio is a secure mobility and operations platform for drivers, passengers, and platform teams.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="index, follow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mobio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/mobio-mark.png">

  <title>Mobio</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">

  <style id="splash-screen-style">
    html, body { min-height: 100%; margin: 0; background: #fff; color: #000; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; gap: 0; padding: 24px; }
    #splash img { width: 112px; height: 112px; object-fit: contain; }
    #splash span { font: 600 48px/1.2 system-ui, sans-serif; letter-spacing: -1.2px; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #000; color: #fff; }
    }
    @media (max-width: 320px) {
      #splash img { width: 88px; height: 88px; }
      #splash span { font-size: 40px; }
    }
  </style>
  <script id="splash-screen-script">
    (function normalizeBioPayReviewUrl() {
      var path = window.location.pathname || "";
      var hash = window.location.hash || "";
      if (path.indexOf("/biopay/") === 0 && hash.indexOf("#/admin") === 0) {
        window.history.replaceState(
          null,
          "",
          path + window.location.search
        );
      }
    })();

    function removeElementById(id) {
      var element = document.getElementById(id);
      if (element && element.parentNode) {
        element.parentNode.removeChild(element);
      }
    }

    function removeSplashFromWeb() {
      removeElementById("splash");
      removeElementById("splash-branding");
      document.body.style.background = "transparent";
    }

    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
    window.setTimeout(function () {
      if (document.querySelector("flutter-view, flt-glass-pane")) {
        removeSplashFromWeb();
      }
    }, 1200);
  </script>
</head>
<body>
  <div id="splash" role="status" aria-label="Mobio is loading">
    <img src="icons/mobio-mark.png" alt="" aria-hidden="true">
    <span aria-hidden="true">Mobio</span>
  </div>

  <script src="flutter_bootstrap.js" async=""></script>





</body></html>
