<!DOCTYPE html><html lang="en"><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mobio is a secure mobility and operations platform for drivers, passengers, and platform teams.">
  <meta name="theme-color" content="#000d19">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="index, follow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mobio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/mobio-mark.png">

  <title>Mobio</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">

  <style id="splash-screen-style">
    @font-face {
      font-family: Inter;
      src: url("assets/assets/google_fonts/Inter-Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    /* WEB-STATE-002 public signed-out SSO colour context from revolut-design.
       Illumination geometry and launch/retry composition adapt it to Mobio. */
    :root {
      --launch-canvas: #000d19;
      --launch-foreground: #fff;
      --launch-secondary: rgb(255 255 255 / 70%);
      --launch-accent: #6fa0ff;
      --launch-illumination: rgb(99 147 243 / 20%);
      --launch-widget: rgb(255 255 255 / 10%);
      --launch-focus: rgb(111 160 255 / 50%);
      color-scheme: dark;
    }
    html, body {
      min-height: 100%; margin: 0;
      background: var(--launch-canvas); color: var(--launch-foreground);
    }
    #splash {
      position: fixed; inset: 0; display: grid; place-items: center;
      padding: max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background: radial-gradient(ellipse at 50% 0%,
        var(--launch-illumination), transparent 65%), var(--launch-canvas);
      font-family: Inter, system-ui, sans-serif;
      overflow: auto;
    }
    .splash-content { width: min(100%, 352px); text-align: center; }
    #splash img {
      width: 80px; height: 80px; object-fit: contain;
      display: block; margin: 0 auto 24px; border-radius: 24px;
    }
    #splash h1 {
      margin: 0 0 16px; font-size: 32px; line-height: 1.125;
      font-weight: 600; letter-spacing: -0.8px; overflow-wrap: anywhere;
    }
    #splash p {
      margin: 0; color: var(--launch-secondary); font-size: 16px;
      line-height: 1.5; overflow-wrap: anywhere;
    }
    .splash-progress {
      width: 24px; height: 24px; margin: 28px auto 0;
      border: 2px solid var(--launch-widget);
      border-top-color: var(--launch-accent); border-radius: 50%;
      animation: splash-spin 0.9s linear infinite;
    }
    #splash-retry {
      width: 100%; min-height: 44px; padding: 12px 24px; margin-top: 28px;
      border: 0; border-radius: 9999px; background: var(--launch-foreground);
      color: var(--launch-canvas); font: 500 16px/22px Inter, system-ui, sans-serif;
      cursor: pointer; transition: opacity 0.3s cubic-bezier(0.15, 0.5, 0.5, 1);
    }
    #splash-retry:hover { opacity: 0.85; }
    #splash-retry:focus-visible {
      opacity: 1; outline: 2px solid var(--launch-focus); outline-offset: 2px;
    }
    #splash [hidden], #splash.splash-problem .splash-progress { display: none; }
    #splash.splash-problem .splash-content { text-align: left; }
    #splash.splash-problem img { margin-left: 0; }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .splash-progress { animation: none; }
      #splash-retry { transition: none; }
    }
    @media (forced-colors: active) {
      #splash { background: Canvas; color: CanvasText; }
      #splash p { color: CanvasText; }
      #splash-retry { background: ButtonFace; color: ButtonText; border: 1px solid ButtonText; }
      .splash-progress { border-color: GrayText; border-top-color: Highlight; }
    }
  </style>
  <script id="splash-screen-script">
    (function normalizeBioPayReviewUrl() {
      var path = window.location.pathname || "";
      var hash = window.location.hash || "";
      if (path.indexOf("/biopay/") === 0 && hash.indexOf("#/admin") === 0) {
        window.history.replaceState(
          null,
          "",
          path + window.location.search
        );
      }
    })();

    function removeElementById(id) {
      var element = document.getElementById(id);
      if (element && element.parentNode) {
        element.parentNode.removeChild(element);
      }
    }

    var splashTimeout;
    function removeSplashFromWeb() {
      window.clearTimeout(splashTimeout);
      removeElementById("splash");
      removeElementById("splash-branding");
      document.body.style.background = "transparent";
    }

    function showMobioStartupProblem() {
      var splash = document.getElementById("splash");
      if (!splash) return;
      window.clearTimeout(splashTimeout);
      splash.classList.add("splash-problem");
      splash.setAttribute("aria-label", "Mobio is taking longer to open");
      document.getElementById("splash-title").textContent = "Let’s try again";
      document.getElementById("splash-status").textContent =
        "Mobio is taking longer to open. Check your connection and try again.";
      document.getElementById("splash-retry").hidden = false;
    }

    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
    window.addEventListener("error", function (event) {
      if (event.target && event.target.id === "mobio-bootstrap") {
        showMobioStartupProblem();
      }
    }, true);
    window.addEventListener("DOMContentLoaded", function () {
      if (!document.getElementById("splash")) return;
      document.getElementById("splash-retry").addEventListener("click", function () {
        window.location.reload();
      });
      splashTimeout = window.setTimeout(showMobioStartupProblem, 25000);
    });
  </script>
</head>
<body>
  <div id="splash" role="status" aria-label="Mobio is loading">
    <div class="splash-content">
      <img src="icons/mobio-mark.png" alt="" aria-hidden="true">
      <h1 id="splash-title">Mobio</h1>
      <p id="splash-status">Opening your next connection…</p>
      <div class="splash-progress" aria-hidden="true"></div>
      <button id="splash-retry" type="button" hidden>Try again</button>
      <noscript>
        <style>#splash-status, .splash-progress { display: none; }</style>
        <p>Turn on JavaScript in your browser to open Mobio.</p>
      </noscript>
    </div>
  </div>

  <script id="mobio-bootstrap" src="flutter_bootstrap.js" async=""></script>





</body></html>
